services:
  - type: web
    name: computer-quiz-bot
    runtime: python
    plan: free
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_PATH
        value: telegram-webhook
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /tmp/quiz_bot.sqlite3
